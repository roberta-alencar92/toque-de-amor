
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Toque de Amor</title>

    <style>
        @font-face {
            font-family: "Cormorant";
            src: url("/static/fonts/CormorantGaramond-Regular.ttf");
        }

        @font-face {
            font-family: "Montserrat";
            src: url("/static/fonts/Montserrat-Regular.ttf");
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #fff7f8;
            font-family: "Montserrat", Arial, sans-serif;
            color: #44343a;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            padding: 40px 35px;
            border-radius: 16px;
            box-shadow: 0 5px 25px rgba(135, 62, 89, 0.10);
            text-align: center;
        }

        .logo {
            width: 170px;
            max-width: 100%;
            margin-bottom: 15px;
        }

        h1 {
            font-family: "Cormorant", Georgia, serif;
            font-size: 34px;
            font-weight: normal;
            color: #873e59;
            margin: 5px 0;
        }

        .subtitulo {
            font-size: 12px;
            color: #987783;
            margin-bottom: 30px;
        }

        .campo {
            text-align: left;
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: bold;
            color: #873e59;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ead5dc;
            border-radius: 7px;
            font-family: inherit;
            font-size: 13px;
            outline: none;
        }

        input:focus {
            border-color: #873e59;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            background: #873e59;
            color: white;
            border: none;
            border-radius: 7px;
            font-family: inherit;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #6f3048;
        }

        .mensagem-erro {
            background: #fff0f0;
            color: #a33d4b;
            border: 1px solid #f0cfd3;
            border-radius: 7px;
            padding: 11px;
            font-size: 12px;
            margin-bottom: 18px;
        }

        .rodape {
            margin-top: 28px;
            font-family: "Cormorant", Georgia, serif;
            font-size: 16px;
            font-style: italic;
            color: #987783;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <img
            src="{{ url_for('static', filename='Logo.png') }}"
            alt="Logo Toque de Amor"
            class="logo"
        >

        <h1>Bem-vinda!</h1>

        <p class="subtitulo">
            Acesse o sistema Toque de Amor
        </p>

        {% with mensagens = get_flashed_messages(category_filter=["erro"]) %}
            {% if mensagens %}
                {% for mensagem in mensagens %}
                    <div class="mensagem-erro">
                        {{ mensagem }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('login') }}">

            <!-- Proteção CSRF -->
            <input
                type="hidden"
                name="csrf_token"
                value="{{ csrf_token() }}"
            >

            <div class="campo">
                <label for="usuario">USUÁRIO</label>

                <input
                    type="text"
                    id="usuario"
                    name="usuario"
                    placeholder="Digite seu usuário"
                    autocomplete="username"
                    required
                    autofocus
                >
            </div>

            <div class="campo">
                <label for="senha">SENHA</label>

                <input
                    type="password"
                    id="senha"
                    name="senha"
                    placeholder="Digite sua senha"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button type="submit">
                ENTRAR NO SISTEMA
            </button>

        </form>

        <div class="rodape">
            Toque de Amor - Carinho em cada detalhe!
        </div>

    </div>

</body>
</html>
