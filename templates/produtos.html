
    <!DOCTYPE html>
    <html lang="pt-br">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Produtos | Toque de Amor</title>

        <!-- Fontes -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

        <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">

        <style>

            * {
                box-sizing: border-box;
            }

            body {
                font-family: 'Montserrat', sans-serif;
                background-color: #fff7f9;
                margin: 0;
                padding: 35px;
                color: #593b47;
            }

            .container {
                max-width: 1100px;
                margin: auto;
            }

            header {
                text-align: center;
                margin-bottom: 35px;
            }

            .logo {
                width: 230px;
                max-width: 80%;
                height: auto;
                margin-bottom: 10px;
            }

            h1 {
                font-family: 'Cormorant Garamond', Georgia, serif;
                font-size: 42px;
                font-weight: 600;
                color: #9b4567;
                margin: 0;
            }

            .subtitulo {
                font-size: 13px;
                color: #987b87;
                letter-spacing: 1px;
                margin-top: 5px;
            }

            .conteudo {
                background: white;
                padding: 28px;
                border-radius: 14px;
                box-shadow: 0 4px 18px rgba(130, 65, 90, 0.08);
            }

            h2 {
                font-family: 'Cormorant Garamond', Georgia, serif;
                font-size: 29px;
                color: #9b4567;
                margin-top: 0;
            }

            table {
                width: 100%;
                border-collapse: collapse;
                background-color: white;
            }

            th {
                background-color: #a95677;
                color: white;
                font-size: 12px;
                font-weight: 600;
                letter-spacing: 0.5px;
                text-transform: uppercase;
                padding: 15px;
                text-align: left;
            }

            td {
                padding: 13px 15px;
                border-bottom: 1px solid #f1e3e9;
                font-size: 13px;
            }

            tr:hover td {
                background-color: #fff7f9;
            }

            .preco {
                font-weight: 600;
                color: #9b4567;
            }

            .voltar {
                display: inline-block;
                margin-top: 25px;
                color: #9b4567;
                text-decoration: none;
                font-size: 13px;
                font-weight: 600;
            }

            .voltar:hover {
                color: #713049;
                text-decoration: underline;
            }

            @media (max-width: 650px) {
                body {
                    padding: 15px;
                }

                .conteudo {
                    padding: 15px;
                    overflow-x: auto;
                }

                h1 {
                    font-size: 34px;
                }

                table {
                    min-width: 550px;
                }
            }


    .formulario {
        background-color: #fff7f9;
        padding: 22px;
        border-radius: 12px;
        margin-bottom: 30px;
        border: 1px solid #f1dce5;
    }

    .formulario label {
        display: block;
        margin-top: 12px;
        margin-bottom: 6px;
        font-size: 13px;
        font-weight: 600;
        color: #75445a;
    }

    .formulario input,
    .formulario select {
        width: 100%;
        padding: 11px;
        border: 1px solid #e5c6d3;
        border-radius: 6px;
        font-family: 'Montserrat', sans-serif;
        background: white;
    }

    .formulario button {
        margin-top: 18px;
        padding: 12px 22px;
        border: none;
        border-radius: 6px;
        background-color: #a95677;
        color: white;
        font-family: 'Montserrat', sans-serif;
        font-weight: 600;
        cursor: pointer;
    }

    .formulario button:hover {
        background-color: #853d5c;
    }

    .botao-excluir {
        background-color: #f4dce4;
        color: #963e60;
        border: none;
        padding: 8px 12px;
        border-radius: 5px;
        font-family: 'Montserrat', sans-serif;
        font-size: 12px;
        cursor: pointer;
    }

    .botao-excluir:hover {
        background-color: #e9bdcd;
    }

        </style>

    </head>

    <body>

        <div class="container">

            <header>

                <img
                    src="{{ url_for('static', filename='Logo.png') }}"
                    alt="Logo Toque de Amor"
                    class="logo"
                >

                <h1>Produtos</h1>

                <p class="subtitulo">
                    CATÁLOGO DE PRODUTOS
                </p>

            </header>

            <div class="conteudo">


    <div class="formulario">

        <h2>Novo produto</h2>

        <form action="{{ url_for('cadastrar_produto') }}" method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <label>Nome do produto</label>
            <input type="text" name="nome" required>

            <label>Categoria</label>
            <input type="text" name="categoria" required>

            <label>Preço (R$)</label>
            <input type="number" name="preco" step="0.01" min="0.01" required>

            <label>Unidade</label>
            <select name="unidade" required>
                <option value="Unidade">Unidade</option>
                <option value="Pacote">Pacote</option>
                <option value="Caixa">Caixa</option>
            </select>

            <button type="submit">Cadastrar produto</button>

        </form>

    </div>

                <h2>Nossos produtos</h2>

                <table>

                    <tr>
                        <th>Categoria</th>
                        <th>Produto</th>
                        <th>Preço</th>
                        <th>Unidade</th>
                        <th>Ações</th>
                    </tr>

                    {% for produto in produtos %}

                    <tr>
        <td>{{ produto["categoria"] }}</td>
        <td>{{ produto["nome"] }}</td>

        <td class="preco">
            R$ {{ "%.2f"|format(produto["preco"]) }}
        </td>

        <td>{{ produto["unidade"] }}</td>

        <td>
            <form
                action="{{ url_for('excluir_produto', id=produto['id']) }}"
                method="POST"
                onsubmit="return confirm('Deseja realmente excluir este produto?');"
            >
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <button type="submit" class="botao-excluir">
                    Excluir
                </button>
            </form>
        </td>
    </tr>

                    {% endfor %}

                </table>

                <a href="/" class="voltar">
                    ← Voltar para o início
                </a>

            </div>

        </div>

    </body>
    </html>
